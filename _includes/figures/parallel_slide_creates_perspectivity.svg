<svg width="100%" viewBox="0 0 680 390" role="img" style="" xmlns="http://www.w3.org/2000/svg">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Sliding line l-prime by one translation vector so A-prime lands on A</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Line l holds points A, B, C. The original line l-prime, drawn faded, holds A-prime, B-prime, C-prime. Coral dashed arrows, all identical, translate every point of l-prime by the same vector, so A-prime lands exactly on A and the line arrives at its new position l-double-prime holding B-double-prime and C-double-prime. Rays from a single center O now pass through B and B-double-prime, and through C and C-double-prime, showing the correspondence has become a simple projection.</desc>
